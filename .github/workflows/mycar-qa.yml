name: MYCAR Cloud UI QA

on:
  push:
    branches: [develop, 'feature/v3.4.6-controlled-restore']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright:
    name: UI regression - Chromium and WebKit
    runs-on: ubuntu-24.04
    container: 
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 20
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
      - name: Install Node.js on GitHub runner (not your PC)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Validate backup preview
        run: node --test tests/backup-preview.test.cjs
      - name: Validate restore dry run
        run: node --test tests/restore-dry-run.test.cjs
      - name: Validate pre-restore snapshot
        run: node --test tests/pre-restore-snapshot.test.cjs
      - name: Run isolated UI tests
        run: npm run test:ui
        env:
          CI: 'true'
      - name: Upload screenshots, HTML report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mycar-playwright-report-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
