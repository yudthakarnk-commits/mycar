name: MYCAR Staging Cloud Sync QA

on:
  push:
    branches: [develop]
    paths:
      - 'cloud-sync.js'
      - 'tests/staging-sync.test.mjs'
      - '.github/workflows/mycar-staging-sync.yml'

permissions:
  contents: read

concurrency:
  group: mycar-staging-sync
  cancel-in-progress: false

jobs:
  sync-integration:
    name: Offline queue and multi-device synchronization
    if: github.repository == 'yudthakarnk-commits/mycar' && github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: mycar-staging-qa
    timeout-minutes: 10
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test cloud-sync.js against staging only
        run: node tests/staging-sync.test.mjs
        env:
          MYCAR_STAGING_URL: ${{ secrets.MYCAR_STAGING_URL }}
          MYCAR_STAGING_PUBLISHABLE_KEY: ${{ secrets.MYCAR_STAGING_PUBLISHABLE_KEY }}
          MYCAR_TEST_USER_A_EMAIL: ${{ secrets.MYCAR_TEST_USER_A_EMAIL }}
          MYCAR_TEST_USER_A_PASSWORD: ${{ secrets.MYCAR_TEST_USER_A_PASSWORD }}
