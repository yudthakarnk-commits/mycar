name: Receipt QA
on:
  push:
    branches: [feature/fuel-receipt-scanner]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check pinned assets
        run: cd vendor/ocr && sha256sum -c SHA256SUMS
      - name: Syntax and regression
        run: |
          node --check app.js
          node --check fuel-receipt-ui.js
          node --check service-worker.js
          node tests/fuel-receipt.test.cjs
      - name: Browser smoke test with synthetic receipt
        run: |
          npm install --prefix "$RUNNER_TEMP/receipt-qa" --no-save --package-lock=false playwright@1.56.1
          export NODE_PATH="$RUNNER_TEMP/receipt-qa/node_modules"
          node -e "const v=require('playwright/package.json').version; if(v!=='1.56.1')throw Error(v); console.log('Playwright '+v)"
          node "$NODE_PATH/playwright/cli.js" install --with-deps chromium webkit
          timeout 180s node tests/receipt-browser.cjs
          timeout 360s node tests/receipt-form-offline.cjs
